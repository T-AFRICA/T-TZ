version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps (framework, test runner, type packages) are planned work with
    # their own testing, not weekly PRs: ignore them here and upgrade on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
